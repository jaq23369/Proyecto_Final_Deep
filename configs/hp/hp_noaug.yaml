# Búsqueda de hiperparámetros (solo val): mnv3_ft_cost con sin aumento de datos. Se corre con --runs-dir runs_hp.
name: hp_noaug
notes: "mnv3_ft_cost con sin aumento de datos (búsqueda de hiperparámetros)"
model: {name: mobilenet_v3_small, pretrained: true, freeze: none}
data: {input_size: 224, augment: false, batch_size: 128, num_workers: 6, subset: 1.0}
optim: {name: adamw, lr: 3.0e-4, weight_decay: 1.0e-4, scheduler: cosine, warmup_epochs: 1}
loss: {label_smoothing: 0.0, cost_weight_busy: 3.0}
train: {epochs: 10, early_stopping_patience: 3, amp: true, seed: 42}
select: {scenario: comercial}
eval: {n_boot: 1000}
