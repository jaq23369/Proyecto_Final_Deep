# Escenario 1: parqueo comercial de pago. Valor en Q/mes para el operador.
# Cada parámetro: {value, source, confidence}; confidence ∈ {medido, literatura, estimado}.
# Los valores 'estimado' se reemplazan con las mediciones de campo.
# costo_por_1000_pred_Q tiene su valor por defecto en configs/costs.yaml; se puede sobrescribir aquí.
name: comercial
description: Parqueo comercial de pago; valor para el operador en Q por mes.
periodo: mes
objective: valor_operador_mes

params:
  espacios:
    value: 164
    source: "Igual al número de espacios únicos de CNR-EXT; reemplazar con el parqueo real"
    confidence: estimado
  ocupacion:
    value: 0.85
    source: "Ocupación en hora pico; estimado, reemplazar con conteo de campo"
    confidence: estimado
  llegadas_dia:
    value: 1100
    source: "Aproximadamente 6.7 rotaciones por espacio al día; estimado, reemplazar con conteo de campo"
    confidence: estimado
  dias_mes:
    value: 30
    source: "Operación todos los días del mes"
    confidence: estimado
  horas_operacion_dia:
    value: 14
    source: "Horario típico de centro comercial; estimado"
    confidence: estimado
  refresh_s:
    value: 30
    source: "Un frame por cámara cada 30 s (decisión de diseño)"
    confidence: estimado
  t_base_min:
    value: 6.0
    source: "Shoup (2006, Transport Policy 13(6):479-486): estudios de 1927 a 2001 con 3.5 a 14 min de búsqueda, promedio 8.1 min; INRIX (2017, encuesta a ~6,000 conductores de EE. UU.): ~12 min por búsqueda; ParkMobile (2024): ~10 min. No hay una medición publicada para Guatemala; el estudio FECAMCO (2026) reporta 3 h 10 min diarias de traslado en la Ciudad de Guatemala, la peor de la región, así que la congestión local no es menor. Se usan 6 min (debajo del promedio, conservador) para un parqueo cerrado; reemplazar con medición de campo"
    confidence: literatura
  t_acceso_min:
    value: 0.85
    source: "Entrar al parqueo y estacionar, independiente de dónde esté el espacio; estimado, reemplazar con medición de campo"
    confidence: estimado
  t_recorrido_total_min:
    value: 4.0
    source: "Tiempo de recorrer todos los pasillos del parqueo a velocidad de búsqueda (~10 km/h); medible en campo"
    confidence: estimado
  t_redireccion_min:
    value: 1.5
    source: "Tiempo extra al encontrar ocupado un espacio indicado como libre; estimado, reemplazar con medición de campo"
    confidence: estimado
  abandono_base:
    value: 0.08
    source: "Supuesto crítico (estimado, sin fuente directa por visita): forma lineal p_ab ∝ tiempo de búsqueda. Referencias indirectas: INRIX (2017), 34 % de los conductores abandonó al menos un viaje al año por problemas de parqueo y 63 % evitó destinos por esa razón. Domina el valor absoluto en Q, no el ranking de modelos; se reemplaza con encuesta y medición de campo."
    confidence: estimado
  ingreso_por_visita_Q:
    value: 25
    source: "Tarifa de ~Q12.5/h por 2 h de estancia promedio; referencia: parqueos comerciales de la zona 4 de Guatemala cobran Q10/h o tarifas únicas de Q15-Q20 (La Hora y AGN, 2025)"
    confidence: estimado
  valor_tiempo_Q_h:
    value: 25
    source: "Valor del tiempo del conductor; referencia: el USDOT valora el tiempo de viaje personal local en ~50 % del salario por hora; con ingresos de clase media en Guatemala da ~Q20-30/h"
    confidence: estimado
  segundos_por_revision:
    value: 10
    source: "Tiempo para revisar un espacio en la cámara; medir en campo"
    confidence: estimado
  revisiones_por_hora_amber:
    value: 30
    source: "Cada espacio en amarillo se re-revisa ~cada 2 min para que el estado siga vigente"
    confidence: estimado
  fraccion_tiempo_operador:
    value: 0.5
    source: "Fracción del tiempo del encargado actual disponible para verificar"
    confidence: estimado
  operadores_incluidos:
    value: 1
    source: "Encargado/guardia que ya existe; su costo no es incremental"
    confidence: estimado
  salario_operador_Q_h:
    value: 25
    source: "Costo por hora de un operador adicional con prestaciones; referencia: salario mínimo no agrícola 2026 (CE1) Q4,002.28/mes, ~Q21/h, más prestaciones"
    confidence: estimado
  precision_verificacion:
    value: 0.95
    source: "Los casos en amarillo son los más ambiguos (sombras, oclusión); un operador también se equivoca. Estimado; medir en campo"
    confidence: estimado
  n_camaras:
    value: 9
    source: "Igual al número de cámaras de CNR-EXT"
    confidence: estimado
  costo_camara_Q:
    value: 1500
    source: "Cámara IP exterior con instalación; conservador: en tiendas de Guatemala una cámara IP exterior de 2-5 MP cuesta Q150-Q770 y un kit de 4 cámaras Hikvision ~Q2,195 (Pacifiko, 2026); reemplazar con cotización"
    confidence: estimado
  costo_servidor_mes_Q:
    value: 400
    source: "Servidor CPU pequeño o en la nube; estimado, reemplazar con cotización"
    confidence: estimado
  meses_amortizacion:
    value: 36
    source: "Vida útil de 3 años para el equipo; estimado"
    confidence: estimado
  costo_sensor_instalado_Q:
    value: 770
    source: "~USD 100 por espacio (sensor + instalación); conservador: el USDOT ITS JPO (2020) reporta USD 300-500 por espacio para sensores ultrasónicos, así que el ahorro frente a sensores está subestimado. En Guatemala ya se usan: Centro Comercial Miraflores instaló 1,220 sensores (Quercus Technologies) y Oakland Mall tiene guiado por luces desde 2011; reemplazar con cotización"
    confidence: estimado
  mantenimiento_sensores_mes_Q:
    value: 300
    source: "Mantenimiento mensual de la red de sensores; estimado"
    confidence: estimado
