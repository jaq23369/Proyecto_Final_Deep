# B1: baseline clásico sin deep learning (scripts/train_classical.py).
name: b1_hog_lr
notes: "HOG 64x64 en gris + StandardScaler + regresión logística; C elegido en val por valor"
model:
  name: hog_lr
  C_grid: [0.01, 0.1, 1.0]
  solver: lbfgs
  max_iter: 2000
  hog: {image_size: 64, orientations: 9, pixels_per_cell: 8, cells_per_block: 2}
data: {subset: 1.0, n_jobs: -1}
train: {seed: 42}
select: {scenario: comercial}
eval: {n_boot: 1000}
